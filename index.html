<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>理社一問一答・実践テスト＆定期試験予想問題集（深掘り解説付き）</title>
<style>
/* ===== デザイントークン（ライト／ダーク自動対応） ===== */
:root{
  --bg:#f4f6f9;--card:#ffffff;--card2:#f8fafc;--ink:#1b2028;--sub:#5b6472;--line:#dbe2ea;
  --acc:#2563eb;--accbg:#eff6ff;--sci:#15803d;--scibg:#f0fdf4;--soc:#6d28d9;--socbg:#f5f3ff;
  --ok:#166534;--okbg:#dcfce7;--ng:#b91c1c;--ngbg:#fee2e2;
  --tip:#92400e;--tipbg:#fef3c7;--tipbd:#f59e0b;
  --exam:#b45309;--exambg:#fffbeb;--exambd:#f59e0b;
  --deep:#0f766e;--deepbg:#f0fdfa;--deepbd:#14b8a6;
  --barbg:#e2e8f0;--redsheet:#e11d48;--numbg:#e0e7ff;--numink:#1e3a8a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11141b;--card:#1a1f2b;--card2:#222836;--ink:#f1f5f9;--sub:#94a3b8;--line:#2d3545;
    --acc:#60a5fa;--accbg:#1e293b;--sci:#4ade80;--scibg:#14291e;--soc:#a78bfa;--socbg:#231b38;
    --ok:#4ade80;--okbg:#142e20;--ng:#f87171;--ngbg:#361b1e;
    --tip:#fbbf24;--tipbg:#2d2312;--tipbd:#d97706;
    --exam:#fbbf24;--exambg:#2a1f0d;--exambd:#d97706;
    --deep:#2dd4bf;--deepbg:#112a27;--deepbd:#0d9488;
    --barbg:#2a3140;--redsheet:#be123c;--numbg:#1e3a8a;--numink:#93c5fd;
  }
}
:root[data-theme="dark"]{
  --bg:#11141b;--card:#1a1f2b;--card2:#222836;--ink:#f1f5f9;--sub:#94a3b8;--line:#2d3545;
  --acc:#60a5fa;--accbg:#1e293b;--sci:#4ade80;--scibg:#14291e;--soc:#a78bfa;--socbg:#231b38;
  --ok:#4ade80;--okbg:#142e20;--ng:#f87171;--ngbg:#361b1e;
  --tip:#fbbf24;--tipbg:#2d2312;--tipbd:#d97706;
  --exam:#fbbf24;--exambg:#2a1f0d;--exambd:#d97706;
  --deep:#2dd4bf;--deepbg:#112a27;--deepbd:#0d9488;
  --barbg:#2a3140;--redsheet:#be123c;--numbg:#1e3a8a;--numink:#93c5fd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;overflow-x:hidden;line-height:1.6}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:650px;padding:12px 14px 54px}
button,input,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ===== ヘッダー ===== */
.header{
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:10px 14px;margin-bottom:10px;box-shadow:0 3px 10px rgba(0,0,0,0.04);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:15.5px;letter-spacing:0.02em}
.brand-badge{
  width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--acc),#4f46e5);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(37,99,235,0.28);
}
.header-tools{display:flex;align-items:center;gap:6px}
.pill-btn{
  background:var(--bg);border:1.5px solid var(--line);color:var(--ink);
  border-radius:11px;padding:7px 11px;font-size:12px;font-weight:800;
  display:inline-flex;align-items:center;gap:5px;cursor:pointer;transition:all .15s;
}
.pill-btn:hover{border-color:var(--acc);background:var(--card2)}
.pill-btn:active{transform:scale(0.97)}
.pill-btn.on{border-color:var(--acc);color:var(--acc);background:var(--accbg)}

/* ===== メインナビゲーション（4タブ） ===== */
.main-nav{
  display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px;
}
.mnav-btn{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:10px 4px;font-size:11.5px;font-weight:800;color:var(--sub);cursor:pointer;
  transition:all .16s cubic-bezier(.2,.8,.2,1);
}
.mnav-btn:hover:not(.active){border-color:var(--acc);color:var(--ink)}
.mnav-btn:active{transform:scale(0.97)}
.mnav-btn.active{
  background:var(--acc);color:#fff;border-color:var(--acc);
  box-shadow:0 4px 12px rgba(37,99,235,0.25);transform:translateY(-1px);
}
.mnav-badge{
  position:absolute;top:-6px;right:-4px;background:var(--ng);color:#fff;
  font-size:10px;font-weight:900;padding:1px 6px;border-radius:99px;
  border:2px solid var(--bg);line-height:1.25;
}
.mnav-dot{
  position:absolute;top:7px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--tipbd);
}

/* ===== カード＆共通パーツ ===== */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,0.04);
}
.card.exam-mode-card{
  border:2px solid var(--exambd);
  box-shadow:0 6px 18px rgba(245,158,11,0.12);
}
.sub-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.stab-btn{
  padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);color:var(--sub);font-size:12px;font-weight:800;
  cursor:pointer;transition:all .15s;text-align:center;
}
.stab-btn:hover:not(.active){border-color:var(--acc);color:var(--ink)}
.stab-btn.active{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 2px 8px rgba(37,99,235,0.2)}
.stab-btn.active.sci{background:var(--sci);border-color:var(--sci);box-shadow:0 2px 8px rgba(21,128,61,0.2)}
.stab-btn.active.soc{background:var(--soc);border-color:var(--soc);box-shadow:0 2px 8px rgba(109,40,217,0.2)}
.stab-btn.active.weak{background:var(--ng);border-color:var(--ng);box-shadow:0 2px 8px rgba(185,28,28,0.2)}

.sub-filters{
  display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:10px;
  border-bottom:1px dashed var(--line);
}
.chip-btn{
  padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--sub);font-size:11.5px;font-weight:800;cursor:pointer;transition:all .12s;
}
.chip-btn:hover:not(.active){border-color:var(--acc);color:var(--ink)}
.chip-btn.active{background:var(--ink);color:var(--card);border-color:var(--ink)}

.mode-row{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  margin-bottom:12px;flex-wrap:wrap;
}
.mode-switch{
  display:inline-flex;background:var(--bg);padding:3px;border-radius:11px;border:1px solid var(--line);flex-wrap:wrap;
}
.mode-switch button{
  border:0;background:transparent;color:var(--sub);font-size:11.5px;font-weight:800;
  padding:6px 10px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s;
}
.mode-switch button.active{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,0.12)}
.mode-switch button.active.exam-tab{background:linear-gradient(135deg,#d97706,#b45309);color:#fff}

/* ===== 実践テスト・定期試験予想バナー ===== */
.test-notice-bar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  background:var(--exambg);border:1.5px solid var(--exambd);border-radius:12px;
  padding:8px 12px;margin-bottom:12px;font-size:12px;font-weight:800;color:var(--exam);
}
.test-notice-bar.practice{
  background:var(--accbg);border-color:var(--acc);color:var(--acc);
}

/* ===== 進捗バー（テスト用） ===== */
.prog-wrap{margin-bottom:12px}
.prog-top{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--sub);margin-bottom:4px;flex-wrap:wrap;gap:4px}
.prog-bar{height:8px;background:var(--barbg);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--acc);transition:width .25s ease;border-radius:99px}
.prog-fill.exam{background:linear-gradient(90deg,#f59e0b,#d97706)}

/* ===== タイマー表示バー ===== */
.timer-wrap{
  background:var(--card2);border:1px solid var(--line);border-radius:11px;
  padding:8px 11px;margin-bottom:12px;
}
.timer-top{
  display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;
  font-size:12px;font-weight:900;margin-bottom:5px;
}
.timer-sec{font-size:14px;color:var(--acc)}
.timer-sec.warn{color:var(--ng);animation:pulse .6s infinite alternate}
.timer-bar{height:6px;background:var(--barbg);border-radius:99px;overflow:hidden}
.timer-fill{height:100%;background:var(--acc);transition:width .1s linear,background-color .2s}
.timer-fill.warn{background:var(--ng)}

/* ===== 問題表示＆選択肢 ===== */
.tags{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.tag{
  display:inline-block;font-size:11px;font-weight:800;border:1px solid var(--line);
  border-radius:6px;padding:2px 8px;color:var(--sub);background:var(--bg);
}
.tag.sub-sci{background:var(--sci);color:#fff;border-color:var(--sci)}
.tag.sub-soc{background:var(--soc);color:#fff;border-color:var(--soc)}
.tag.mastery{background:var(--tipbg);color:var(--tip);border-color:var(--tipbd)}
.tag.exam-freq{background:var(--exambg);color:var(--exam);border-color:var(--exambd);font-weight:900}
.tag.pts-badge{background:var(--accbg);color:var(--acc);border-color:var(--acc);font-weight:900}

.q-text{font-size:18px;font-weight:800;line-height:1.72;margin:8px 0 16px;letter-spacing:0.01em}
.hl-num{
  display:inline-block;background:var(--numbg);color:var(--numink);
  padding:0 5px;border-radius:5px;font-weight:900;margin:0 1px;
}

.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:15px 16px;margin-bottom:10px;font-size:15.5px;font-weight:700;color:var(--ink);
  cursor:pointer;transition:border-color .15s,background .15s,transform .1s,box-shadow .15s;
}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--card2);box-shadow:0 2px 8px rgba(37,99,235,0.08)}
.opt:active:not(:disabled){transform:scale(0.985)}
.opt:disabled{cursor:default}
.opt-num{
  width:28px;height:28px;border-radius:9px;background:var(--bg);border:1.5px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;color:var(--sub);flex-shrink:0;transition:all .15s;
}
.opt.ok{background:var(--okbg);border-color:var(--ok);font-weight:800;animation:bounceOk .32s ease}
.opt.ok .opt-num{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.ng{background:var(--ngbg);border-color:var(--ng);animation:shakeNg .3s ease}
.opt.ng .opt-num{background:var(--ng);color:#fff;border-color:var(--ng)}

/* ===== ヒント＆補助ツールバー ===== */
.assist-bar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  margin-bottom:12px;
}
.hint-box{
  background:var(--tipbg);border:1.5px solid var(--tipbd);border-radius:12px;
  padding:10px 12px;margin-bottom:12px;font-size:13px;line-height:1.55;animation:pop .2s ease;
}
.hint-title{font-size:11.5px;font-weight:900;color:var(--tip);margin-bottom:2px;display:flex;align-items:center;gap:4px}

/* ===== 解説・深掘り・マイメモ・関連ジャンプボックス ===== */
.fb{
  border-radius:14px;padding:14px 15px;margin-top:12px;
  font-size:14px;line-height:1.7;border:1.5px solid transparent;
  animation:pop .2s ease;
}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.ng{background:var(--ngbg);border-color:var(--ng)}
.fb-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.res-title{font-size:18px;font-weight:900}
.fb.ok .res-title{color:var(--ok)}
.fb.ng .res-title{color:var(--ng)}

.pin-btn{
  background:var(--card);border:1.5px solid var(--line);color:var(--ink);
  border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:800;cursor:pointer;
}
.pin-btn.pinned{background:var(--tipbg);border-color:var(--tipbd);color:var(--tip)}

.tip-box{
  margin-top:10px;padding:10px 12px;border-radius:10px;
  background:var(--tipbg);border-left:4px solid var(--tipbd);
  color:var(--ink);font-size:13px;line-height:1.6;
}
.tip-label{font-size:11px;font-weight:900;color:var(--tip);margin-bottom:2px}

/* 年号・語呂合わせカード */
.mnemonic-box{
  margin-top:10px;padding:10px 12px;border-radius:12px;
  background:var(--socbg);border:1.5px solid var(--soc);
  color:var(--ink);font-size:13px;
}
.mnemonic-head{
  font-size:11.5px;font-weight:900;color:var(--soc);margin-bottom:6px;
  display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;
}
.mnemonic-list{display:flex;flex-direction:column;gap:6px}
.mnemonic-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:7px 10px;font-size:12.5px;font-weight:800;
}
.mnemonic-save-btn{
  background:var(--socbg);border:1px solid var(--soc);color:var(--soc);
  border-radius:999px;padding:3px 9px;font-size:11px;font-weight:900;cursor:pointer;flex-shrink:0;
}
.mnemonic-save-btn:hover{background:var(--soc);color:#fff}

/* 深掘り解説（なぜ？・因果関係）パネル */
.deep-box{
  margin-top:10px;padding:11px 13px;border-radius:12px;
  background:var(--deepbg);border:1.5px solid var(--deepbd);
  color:var(--ink);font-size:13px;line-height:1.65;
}
.deep-head{
  display:flex;justify-content:space-between;align-items:center;gap:6px;
  font-size:12px;font-weight:900;color:var(--deep);margin-bottom:4px;
}

/* ファインマン・理解度セルフチェック＆マイメモ */
.feynman-box{
  margin-top:10px;padding:11px 13px;border-radius:12px;
  background:var(--card);border:1.5px solid var(--line);
}
.feynman-title{font-size:12px;font-weight:900;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px}
.mastery-pills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.m-pill{
  padding:7px 4px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);
  font-size:11.5px;font-weight:800;cursor:pointer;text-align:center;transition:all .14s;
}
.m-pill.active-high{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.m-pill.active-mid{background:var(--tipbg);border-color:var(--tipbd);color:var(--tip)}
.m-pill.active-low{background:var(--ngbg);border-color:var(--ng);color:var(--ng)}
.mymemo-row{display:flex;gap:6px;align-items:center}
.mymemo-input{
  flex:1;padding:7px 10px;border-radius:9px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:12.5px;
}
.mymemo-input:focus{outline:none;border-color:var(--acc);background:var(--card)}

/* 関連知識・深掘りジャンプチップ */
.related-box{
  margin-top:10px;padding:9px 11px;border-radius:11px;
  background:var(--card2);border:1px dashed var(--line);
}
.related-lbl{font-size:11px;font-weight:900;color:var(--sub);margin-bottom:5px}
.related-chips{display:flex;gap:6px;flex-wrap:wrap}
.rel-chip{
  background:var(--card);border:1.5px solid var(--acc);color:var(--acc);
  border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:800;cursor:pointer;
}
.rel-chip:hover{background:var(--accbg)}

.btn{
  background:var(--acc);color:#fff;border:0;border-radius:12px;
  padding:13px 16px;font-weight:900;width:100%;font-size:15px;
  cursor:pointer;margin-top:12px;transition:opacity .15s;
}
.btn:hover{opacity:0.92}
.btn.exam-btn{background:linear-gradient(135deg,#d97706,#b45309)}
.btn.ghost{
  background:transparent;color:var(--sub);border:1.5px solid var(--line);
  padding:10px 12px;font-size:12.5px;font-weight:800;margin-top:8px;
}
.btn.danger{background:var(--ng);color:#fff}

/* ===== テスト結果＆定期試験予想模試レポート ===== */
.result-score{font-size:42px;font-weight:900;color:var(--acc);margin:6px 0;line-height:1.1}
.exam-rank-box{
  display:inline-flex;align-items:center;gap:10px;
  padding:8px 18px;border-radius:14px;margin:6px 0 10px;
  font-weight:900;font-size:16px;
}
.exam-rank-S{background:#fef3c7;color:#b45309;border:2px solid #f59e0b}
.exam-rank-A{background:var(--okbg);color:var(--ok);border:2px solid var(--ok)}
.exam-rank-B{background:var(--accbg);color:var(--acc);border:2px solid var(--acc)}
.exam-rank-C{background:var(--ngbg);color:var(--ng);border:2px solid var(--ng)}

.exam-summary-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;
}
.exam-stat-box{
  background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 6px;
}
.exam-stat-lbl{font-size:10.5px;font-weight:800;color:var(--sub)}
.exam-stat-val{font-size:17px;font-weight:900;margin-top:2px}

.review-item{
  background:var(--card2);border:1px solid var(--line);border-radius:13px;
  padding:12px 13px;margin-bottom:9px;text-align:left;font-size:13.5px;line-height:1.62;
}
.review-q{font-weight:800;margin-bottom:5px}
.review-a{color:var(--ok);font-weight:800;font-size:13px}
.review-exp{color:var(--sub);font-size:12.5px;margin-top:4px}

/* ===== 解説・公式集（比較まとめ表・図解・赤シート機能） ===== */
.search-input{
  width:100%;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:14px;margin-bottom:10px;
}
.search-input:focus{outline:none;border-color:var(--acc)}
.formula-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:14px}
.formula-card{
  background:var(--scibg);border:1.5px solid var(--sci);border-radius:12px;padding:11px 13px;
}
.formula-title{font-size:12px;font-weight:900;color:var(--sci);margin-bottom:2px}
.formula-eq{font-size:15px;font-weight:900;margin-bottom:3px}
.formula-note{font-size:12px;color:var(--sub)}

.comp-card{
  background:var(--card2);border:1.5px solid var(--line);border-radius:14px;
  padding:12px;margin-bottom:12px;overflow-x:auto;
}
.comp-title{font-size:13px;font-weight:900;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.comp-table{width:100%;border-collapse:collapse;font-size:12px;min-width:340px}
.comp-table th,.comp-table td{
  border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;
}
.comp-table th{background:var(--accbg);color:var(--acc);font-weight:900}
.comp-table td:first-child{font-weight:900;background:var(--card)}

.red-mask{
  display:inline-block;background:var(--redsheet);color:transparent;
  border-radius:5px;padding:1px 8px;cursor:pointer;user-select:none;
  transition:all .15s;font-weight:900;
}
.red-mask.revealed{background:var(--okbg);color:var(--ok)}

/* ===== 成績分析バー ===== */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-tile{
  background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;

}

.unit-bar{height:8px;background:var(--barbg);border-radius:99px;overflow:hidden}
.unit-fill{height:100%;border-radius:99px;transition:width .3s ease}

  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;

}

  display:inline-flex;align-items:center;gap:5px;font-weight:900;

.goal-bar{flex:1;height:7px;background:var(--barbg);border-radius:99px;overflow:hidden}

.write-input-row{display:flex;gap:8px;margin-bottom:8px}
.write-input{
  flex:1;padding:12px 14px;border-radius:12px;border:2px solid var(--line);

}
.write-input:focus{outline:none;border-color:var(--acc);background:var(--card)}
.memo-pad-wrap{
  margin-top:10px;background:var(--card2);border:1.5px solid var(--line);

}

}

.kbd-hint{font-size:11px;color:var(--sub);text-align:center;margin-top:8px}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(15,23,42,0.58);backdrop-filter:blur(3px);

.setting-lbl{font-size:13.5px;font-weight:800}

}

.welcome-banner{
  background:linear-gradient(135deg,var(--accbg),var(--card));border:1.5px solid var(--acc);
  border-radius:15px;padding:12px 14px;margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
}

.confetti-layer{
  position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:200;
}
.confetti-piece{
  position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;
  animation:confettiFall 1.15s cubic-bezier(.25,.46,.45,.94) forwards;
}

@keyframes pop{0%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes pulse{0%{opacity:1}100%{opacity:0.45}}
@keyframes bounceOk{0%{transform:scale(1)}35%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shakeNg{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(85vh) rotate(540deg);opacity:0}
}

    { name: "リンカン", desc: "南北戦争の際に「人民の、人民による、人民のための政治」という演説を行ったアメリカ大統領", category: "欧米の近代化", examFreq: true, tip: "奴隷解放宣言（1863年）・ゲティズバーグ演説", deepDive: "【南北対立の構造】工業が発達し自由な労働者を求める「北部」と、綿花栽培の大農園（プランテーション）で黒人奴隷を必要とする「南部」が対立し南北戦争へ。リンカンは奴隷解放宣言を出して勝利し、アメリカの一体性を守りました。" },
    { name: "ペリー", desc: "1853年に4隻の軍艦を率いて浦賀に来航し、日本に開国を求めたアメリカの使節", category: "欧米と日本の開国", examFreq: true, tip: "1853年 浦賀来航 → 1854年 日米和親条約", deepDive: "【なぜアメリカが来た？】当時アメリカは太平洋で捕鯨船を操業しており、薪・水・食料の補給基地と、中国（清）との貿易の中継地として日本の開国を強く求めていました。黒船（蒸気船）の軍事力を背景に開国を迫りました。" },
    { name: "ハリス", desc: "日米修好通商条約を結んだ、アメリカの初代駐日総領事", category: "欧米と日本の開国", examFreq: true, tip: "下田に駐在し、1858年に日米修好通商条約を締結", deepDive: "【交渉の背景】ハリスは「イギリスやフランスがアロー戦争の勢いで大軍を率いて日本に来る前に、アメリカと穏便に通商条約を結ぶべきだ」と幕府を説得し、1858年に日米修好通商条約を調印させました。" },
    { name: "井伊直弼", desc: "日米修好通商条約を無断で結び、安政の大獄で反対派を厳しく処罰した大老", category: "欧米と日本の開国", examFreq: true, tip: "日米修好通商条約を調印 → 安政の大獄 → 1860年 桜田門外の変で暗殺", deepDive: "【幕府衰退の決定打】天皇（孝明天皇）の反対を押し切って無断で条約に調印したため、尊王攘夷派から猛批判を受けました。直弼は「安政の大獄」で反対派を弾圧しましたが、その反発から1860年に桜田門外の変で暗殺され、幕府の権威は大きく失墜しました。" },
    { name: "吉田松陰", desc: "松下村塾で多くの志士を育てたが、安政の大獄で処刑された人物", category: "欧米と日本の開国", examFreq: true, tip: "長州藩の松下村塾で高杉晋作・伊藤博文らを指導", deepDive: "【明治維新へのつながり】ペリー艦隊への密航を企てるなど西洋の力を肌で感じ、長州藩の松下村塾で身分にとらわれず若者を指導しました。彼の教えを受けた高杉晋作や伊藤博文らが、のちに倒幕と明治維新の中心となりました。" }
  ],
  terms: [
    { name: "武家諸法度", desc: "幕府が大名を統制するために定めた法律", category: "江戸の成立と対外政策", examFreq: true, tip: "大名の城の無断修理や無断結婚などを禁止した", deepDive: "【統制の仕組み】大名が城を強くしたり、他の大名と勝手に結婚して同盟を結んだりすることを禁じ、違反した大名は領地を取り上げる（改易）などして幕府の絶対的な優位を保ちました。" },
    { name: "参勤交代", desc: "大名に1年おきに江戸と領地を往復させ、多額の費用を負担させる制度", category: "江戸の成立と対外政策", examFreq: true, tip: "妻子は江戸に住まわせ、大名の財力を削いで幕府への反抗を防いだ", deepDive: "【ダブルの抑制効果】①大名の妻子を人質として江戸に住まわせること、②大名行列の莫大な費用で大名の財政を苦しくさせること、の2つによって反乱を防ぎました。" },
    { name: "朱印船貿易", desc: "幕府から渡航の許可状を与えられた船が行った、東南アジアとの貿易", category: "江戸の成立と対外政策", examFreq: false, tip: "東南アジア各地に日本町がつくられた（山田長政など）", deepDive: "【鎖国前の姿】江戸時代初期は、海賊（倭寇）と区別するために将軍の朱印状を持たせて東南アジア貿易を奨励していました。しかしキリスト教禁止の徹底のため1635年に日本人の海外渡航が全面禁止されました。" },
    { name: "島原・天草一揆", desc: "1637年、九州で重い年貢とキリスト教への弾圧に対して起こった大規模な反乱", category: "江戸の成立と対外政策", examFreq: true, tip: "この一揆をきっかけに1639年ポルトガル船の来航が禁止され鎖国が完成", deepDive: "【なぜ鎖国完成につながった？】幕府はキリスト教の信仰が団結力を生み、ポルトガルなどのカトリック国が侵略してくることを恐れました。一揆鎮圧後の1639年にポルトガル船を追い払い、貿易相手をキリスト教の布教をしないオランダと清に限定しました。" },
    { name: "出島", desc: "鎖国政策の中、長崎に作られ、オランダや清とのみ貿易が許された人工島", category: "江戸の成立と対外政策", examFreq: true, tip: "オランダ商館は平戸から長崎の出島へ移された", deepDive: "【鎖国下の情報窓口】オランダ商館長は毎年江戸に参府して将軍に拝謁し、世界の情勢をまとめた報告書（オランダ風説書）を提出する義務がありました。これが鎖国中の日本にとって貴重な海外情報源となりました。" },
    { name: "朝鮮通信使", desc: "将軍の代替わりなどの際に、朝鮮から日本へ派遣された使節", category: "江戸の成立と対外政策", examFreq: true, tip: "朝鮮とは対馬藩（宗氏）を通じて国交を回復した", deepDive: "【外交の仕組み】豊臣秀吉の朝鮮侵略で途絶えていた国交を家康が回復。朝鮮とは対馬藩を窓口として対等な交際を続け、通信使の来日は日本の学者や文化人との交流の場にもなりました。" },
    { name: "踏絵", desc: "キリスト教徒を発見するために、幕府が人々に踏ませたキリストや聖母マリアの像", category: "江戸の成立と対外政策", examFreq: false, tip: "絵踏（えぶみ）を行い、宗門改帳に記録した", deepDive: "【管理の徹底】すべての人々をどこかの寺院に所属させる「寺請制度」とあわせ、キリスト教徒ではないことを毎年証明させました。" },
    { name: "天領（幕領）", desc: "江戸幕府の直接の支配地（直轄地）", category: "江戸の成立と対外政策", examFreq: false, tip: "江戸・大坂・京都などの重要都市や佐渡金山などが含まれる", deepDive: "【幕府の経済基盤】全国の石高の約4分の1を占める直轄地に加え、佐渡金山・石見銀山・生野銀山などの鉱山や、長崎・大坂などの商業都市を直接支配することで幕府の財力を支えました。" },
    { name: "享保の改革", desc: "8代将軍徳川吉宗が行った、質素倹約を基本とし新田開発などを進めた政治改革", category: "産業と幕府政治", examFreq: true, tip: "江戸の三大改革の1つ目（吉宗 → 定信 → 忠邦の順）", deepDive: "【セットで覚える重要語】「目安箱（庶民の意見を集める）」「上げ米の制」「新田開発」「公事方御定書（裁判の基準）」「サツマイモの栽培奨励（青木昆陽）」がすべて享保の改革のキーワードです。" },
    { name: "寛政の改革", desc: "老中松平定信が行った、祖父である吉宗の政治を理想とした厳しい政治改革", category: "産業と幕府政治", examFreq: true, tip: "江戸の三大改革の2つ目。厳しすぎて庶民の不満を招いた", deepDive: "【セットで覚える重要語】「囲い米の制（ききん対策）」「棄捐令（旗本・御家人の借金帳消し）」「寛政異学の禁（朱子学以外の学問を禁止）」「出版統制（山東京伝らを処罰）」を押さえましょう。" },
    { name: "天保の改革", desc: "老中水野忠邦が行った、株仲間の解散などを命じた政治改革", category: "産業と幕府政治", examFreq: true, tip: "江戸の三大改革の3つ目。株仲間を解散したがかえって経済が混乱した", deepDive: "【セットで覚える重要語】「株仲間の解散（物価引き下げ狙い）」「人返しの法（江戸に出稼ぎに来た農民を村へ帰す）」「上知令（江戸・大坂周辺を幕府領にしようとして大名・旗本の猛反発で失敗）」がポイントです。" },
    { name: "株仲間", desc: "商人の同業者組合で、幕府に税を納める代わりに独占的な営業を認められたもの", category: "産業と幕府政治", examFreq: true, tip: "田沼意次が奨励し、水野忠邦が解散させた", deepDive: "【田沼と水野の正反対の政策】田沼意次は「株仲間を認めて税を取る」ことで幕府財政を潤し、水野忠邦は「株仲間が物価を吊り上げている」と考えて解散させました。この対比は定期試験の超頻出テーマです。" },
    { name: "元禄文化", desc: "17世紀後半〜18世紀初め、上方（大坂・京都）の町人を中心に栄えた文化", category: "産業と幕府政治", examFreq: true, tip: "井原西鶴（浮世草子）・近松門左衛門（人形浄瑠璃）・松尾芭蕉（俳諧）", deepDive: "【中心地と代表作】「天下の台所」大坂や京都など上方の経済力を背景に誕生。井原西鶴『日本永代蔵』、近松門左衛門『曽根崎心中』、松尾芭蕉『おくのほそ道』、尾形光琳（琳派）、菱川師宣（浮世絵の祖）をセットで覚えましょう。" },
    { name: "化政文化", desc: "19世紀初め、江戸を中心に栄えた、庶民の生活や世相を反映した文化", category: "産業と幕府政治", examFreq: true, tip: "葛飾北斎・歌川広重（浮世絵）・十返舎一九（『東海道中膝栗毛』）", deepDive: "【元禄文化との違い】政治や経済の中心が江戸へ移り、庶民の識字率が高まったことで貸本屋や寺子屋が普及。多色刷り浮世絵（錦絵）の葛飾北斎『富嶽三十六景』、歌川広重『東海道五十三次』、小林一茶や与謝蕪村の俳諧などが栄えました。" },
    { name: "国学", desc: "日本の古典を研究し、日本古来の精神を明らかにしようとする学問", category: "産業と幕府政治", examFreq: true, tip: "儒学や仏教が伝わる前の日本本来の心を研究（本居宣長）", deepDive: "【学びの広がり】荷田春満・賀茂真淵らによって始まり、本居宣長が35年かけて『古事記伝』を完成させて大成しました。" },
    { name: "蘭学", desc: "オランダ語を通して西洋の医学や天文学などを学ぶ学問", category: "産業と幕府政治", examFreq: true, tip: "吉宗がキリスト教以外の洋書の輸入を緩めたことで発展", deepDive: "【因果関係】8代将軍・徳川吉宗が実学を重視してキリスト教に関係のない洋書の輸入制限を緩めたことで、杉田玄白・前野良沢らの『解体新書』出版につながりました。" },
    { name: "清教徒革命", desc: "17世紀にイギリスで起こり、国王を処刑して共和政を始めた革命", category: "欧米の近代化", examFreq: false, tip: "議会派のクロムウェルが王党派を破り共和政を樹立", deepDive: "【近代議会政治への第一歩】王権神授説を唱える国王に対し、議会の権利を守る市民（清教徒）が立ち上がった革命です。" },
    { name: "名誉革命", desc: "1688年にイギリスで起こり、血を流さずに国王を追放して「権利の章典」を制定した革命", category: "欧米の近代化", examFreq: true, tip: "議会中心の立憲君主制の基礎が確立", deepDive: "【なぜ「名誉」と呼ばれる？】王政復古後に再び専制政治を行った国王に対し、議会が内戦（流血）を起こすことなく国王を追放し、新しい王に「権利の章典」を認めさせて議会中心の政治を確立したため名誉革命と呼ばれます。" },
    { name: "権利の章典", desc: "名誉革命の後にイギリスで制定され、議会政治の基礎となった法律", category: "欧米の近代化", examFreq: true, tip: "1689年制定。国王の権力を制限し議会の権利を認めた", deepDive: "【テストでの区別】1689年イギリス＝「権利の章典」、1776年アメリカ＝「独立宣言」、1789年フランス＝「人権宣言」。年号と国名をセットで整理しましょう。" },
    { name: "独立宣言", desc: "1776年、イギリスの植民地であったアメリカが発表し、基本的人権などをうたった宣言", category: "欧米の近代化", examFreq: true, tip: "トマス＝ジェファソンらが起草（1776年7月4日）", deepDive: "【思想のつながり】イギリスの思想家ロックの社会契約説などの影響を受け、「すべての人は平等に造られ、生命・自由・幸福追求の権利をもつ」と宣言しました。" },
    { name: "フランス革命", desc: "1789年に起こり、絶対王政を倒して「人権宣言」を発表した革命", category: "欧米の近代化", examFreq: true, tip: "重税に苦しむ第三身分がバスティーユ牢獄を襲撃して開始", deepDive: "【背景の原因】当時のフランスは第一身分（聖職者）・第二身分（貴族）が特権を持ち税を免除される一方、人口の98%を占める第三身分（平民）だけに重い税がかけられていました。この不平等への不満が爆発して革命が起きました。" },
    { name: "人権宣言", desc: "フランス革命で発表され、人間の自由と平等、国民主権などを主張した宣言", category: "欧米の近代化", examFreq: true, tip: "1789年、国民議会が採択した近代民主主義の基本文書", deepDive: "【世界への影響】「人は生まれながらにして自由かつ平等な権利をもつ」「主権は国民にある」「所有権は神聖不可侵である」と定め、のちのヨーロッパ諸国の憲法や日本の民主主義にも大きな影響を与えました。" },
    { name: "産業革命", desc: "18世紀後半のイギリスから始まった、機械の発明と蒸気機関の利用による産業や社会の大きな変化", category: "欧米の近代化", examFreq: true, tip: "ワットの蒸気機関改良により工場制機械工業が発達（世界の工場）", deepDive: "【社会の変化と結果】綿織物の生産から始まり、ワットが改良した蒸気機関が工場や蒸気機関車・蒸気船に応用されました。資本家と労働者の貧富の差や都市の環境問題が生まれる一方、欧米列強が原料と市場を求めてアジアへ進出する原動力となりました。" },
    { name: "アヘン戦争", desc: "1840年、麻薬の密輸取締りをきっかけとして、イギリスと清の間で起こった戦争", category: "欧米と日本の開国", examFreq: true, tip: "敗れた清は1842年に南京条約を結び香港をイギリスに割譲", deepDive: "【日本への衝撃】イギリスは茶・絹・陶磁器の輸入による貿易赤字を埋めるため、インド産のアヘンを清へ密輸しました。清の林則徐がこれを厳しく取り締まるとイギリスが開戦。大国・清が敗れたニュースは日本に大きな衝撃を与え、幕府は異国船打払令を改めて薪水給与令を出しました。" },
    { name: "日米和親条約", desc: "1854年、ペリーの要求によって結ばれ、下田と箱館（函館）を開港して鎖国を終わらせた条約", category: "欧米と日本の開国", examFreq: true, tip: "下田・箱館（函館）の2港を開港（貿易はまだ始まっていない）", deepDive: "【ひっかけ注意！】日米和親条約は「船への薪・水・食料の補給（開港）」と「アメリカ領事の下田駐在」を決めた条約であり、本格的な自由貿易は4年後の「日米修好通商条約」から始まります。" },

const makeHistory = (function(){
  const getRandomElement = arr => arr[Math.floor(Math.random() * arr.length)];
  function shuffleArray(arr){
    let a = [...arr];
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function getDummies(src, cur, cnt, prop){
    let d = [...new Set(src.filter(x => x !== cur && x[prop] !== cur[prop]).map(x => x[prop]))];
    return shuffleArray(d).slice(0, cnt);
  }
  function createQuestionData(category, type, qText, ans, dummies, exp, deepDive, tip, examFreq = true, pts = 6, related = [], mnemonics = []){
    let opts = shuffleArray([ans, ...dummies]);
    return {
      subject: "社会", category, type,
      examFreq, freqRate: examFreq ? "★★★★★" : "★★★☆☆", pts,
      question: qText, options: opts, answerIndex: opts.indexOf(ans),
      explanation: exp, deepDive: deepDive || exp, tip, related, mnemonics
    };
  }

  return function(unitFilter = "all", examOnly = false){
    const filterList = list => {
      let res = unitFilter === "all" ? list : list.filter(x => x.category === unitFilter);
      if(examOnly){
        const freq = res.filter(x => x.examFreq);
        if(freq.length > 0) res = freq;
      }
      return res;
    };

    const specialPool = filterList(HISTORY_DATA.examSpecial);
    if(specialPool.length > 0 && (examOnly ? Math.random() < 0.45 : Math.random() < 0.22)){
      const sp = getRandomElement(specialPool);
      return createQuestionData(
        sp.category, sp.type, sp.question, sp.correct, sp.wrongs, sp.explanation, sp.deepDive, sp.tip, true, sp.pts || 7,
        [{ label: "比較まとめ表で整理する", tab: "guide", search: "" }, { label: `${sp.category}の演習へ`, tab: "quiz", sub: "社会", unit: sp.category }]
      );
    }

    const pPool = filterList(HISTORY_DATA.people);
    const tPool = filterList(HISTORY_DATA.terms);
    const ePool = filterList(HISTORY_DATA.events);

    const availableModes = [];
    if(pPool.length) availableModes.push("people", "desc_p");
    if(tPool.length) availableModes.push("terms", "desc_t");
    if(ePool.length) availableModes.push("events", "events");
    const mode = availableModes.length ? getRandomElement(availableModes) : "terms";

    if(mode === "people"){
      let item = getRandomElement(pPool);
      return createQuestionData(
        item.category, "人物", `${item.desc}は誰ですか。`, item.name,
        getDummies(HISTORY_DATA.people, item, 3, "name"),
        `正解は「${item.name}」です。${item.desc}。`, item.deepDive, item.tip, !!item.examFreq, 6,
        [{ label: `「${item.name}」の用語解説へ`, tab: "guide", search: item.name }, { label: `${item.category}を連続演習`, tab: "quiz", sub: "社会", unit: item.category }]
      );
    } else if(mode === "terms"){
      let item = getRandomElement(tPool);
      const matchedEvent = HISTORY_DATA.events.find(e => e.name === item.name);
      return createQuestionData(
        item.category, "用語", `${item.desc}を何といいますか。`, item.name,
        getDummies(HISTORY_DATA.terms, item, 3, "name"),
        `正解は「${item.name}」です。${item.desc}。`, item.deepDive, item.tip, !!item.examFreq, 6,
        [{ label: `「${item.name}」の解説を見る`, tab: "guide", search: item.name }, { label: `${item.category}を連続演習`, tab: "quiz", sub: "社会", unit: item.category }],
        matchedEvent ? matchedEvent.mnemonics : []
      );
    } else if(mode === "desc_p" || mode === "desc_t"){
      let srcAll = mode === "desc_p" ? HISTORY_DATA.people : HISTORY_DATA.terms;
      let item = getRandomElement(mode === "desc_p" ? pPool : tPool);
      return createQuestionData(
        item.category, "説明", `「${item.name}」の説明として正しいものはどれですか。`, item.desc,
        getDummies(srcAll, item, 3, "desc"),
        `「${item.name}」は、${item.desc}。`, item.deepDive, item.tip, !!item.examFreq, 7,
        [{ label: `「${item.name}」を深掘り確認`, tab: "guide", search: item.name }]
      );
    } else {
      let item = getRandomElement(ePool);
      const rel = [{ label: "年号・語呂合わせ一覧を見る", tab: "guide", search: "年" }, { label: `${item.category}の演習へ`, tab: "quiz", sub: "社会", unit: item.category }];
      if(Math.random() > 0.35){
        return createQuestionData(
          item.category, "年号", `「${item.name}」が起きた（結ばれた）年はいつですか。`, item.year,
          getDummies(HISTORY_DATA.events, item, 3, "year"),
          `${item.year}に、${item.desc}。`, item.deepDive, item.tip, !!item.examFreq, 6, rel, item.mnemonics || []
        );
      }
      return createQuestionData(
        item.category, "出来事", `${item.year}に起きた出来事として正しいものはどれですか。`, item.name,
        getDummies(HISTORY_DATA.events, item, 3, "name"),
        `${item.year}には「${item.name}」が起きました。${item.desc}。`, item.deepDive, item.tip, !!item.examFreq, 6, rel, item.mnemonics || []
      );
    }
  };
})();

const SFX = (function(){
  let ctx = null;
  function tone(freq, dur, type="sine", vol=0.055, delay=0){
    if(!STATE.sound) return;
    try{
      if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if(ctx.state === "suspended") ctx.resume();
      const t = ctx.currentTime + delay;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + dur);
    }catch(_){}
  }
  return {
    tap(){ tone(540, 0.045, "triangle", 0.04); },
    ok(){ tone(523, 0.08, "triangle", 0.065); tone(659, 0.08, "triangle", 0.065, 0.06); tone(784, 0.14, "triangle", 0.075, 0.12); },
    ng(){ tone(220, 0.12, "sawtooth", 0.05); tone(175, 0.18, "sawtooth", 0.05, 0.1); }
  };
})();

}

      stopQuestionTimer();
      return;
    }
    const elapsed = (Date.now() - startMs) / 1000;
    const rem = Math.max(0, maxSec - elapsed);
    session.timeLeftSec = rem;
    const secEl = document.getElementById("timer-sec");
    const fillEl = document.getElementById("timer-fill");
    if(secEl){
      secEl.textContent = `${rem.toFixed(1)} 秒`;
      secEl.classList.toggle("warn", rem <= 5);
    }
    if(fillEl){
      fillEl.style.width = `${(rem / maxSec) * 100}%`;
      fillEl.classList.toggle("warn", rem <= 5);
    }
    if(rem <= 0){
      stopQuestionTimer();
      handleQuizAnswer(-1, true);
    }
  }, 100);
}

function pickQuizQuestion(){
  const inTest = isTestMode();
  const isExamPred = STATE.quizMode === "exam_pred";

  if(!inTest && session.spiralQueue && session.spiralQueue.length > 0){
    for(let i = 0; i < session.spiralQueue.length; i++){
      session.spiralQueue[i].wait--;
    }
    const readyIdx = session.spiralQueue.findIndex(item => item.wait <= 0);
    if(readyIdx !== -1){
      const due = session.spiralQueue.splice(readyIdx, 1)[0];
      return {
        ...due.questionObj,
        isSpiralReview: true,
        spiralReason: due.reason
      };
    }
  }

  const generateCandidate = () => {
    if(STATE.subject === "weak"){
      const weakList = getWeakUnitsSummary();
      if(weakList.length > 0){
        const target = weakList[Math.floor(Math.random() * weakList.length)];
        return target.subject === "理科" ? makeScience(target.category, isExamPred) : makeHistory(target.category, isExamPred);
      }
    }
    if(STATE.subject === "理科") return makeScience(STATE.unit, isExamPred);
    if(STATE.subject === "社会") return makeHistory(STATE.unit, isExamPred);
    return Math.random() < 0.5 ? makeScience("all", isExamPred) : makeHistory("all", isExamPred);
  };

  let q = null;
  for(let attempt = 0; attempt < 35; attempt++){
    let cand = generateCandidate();

    if(STATE.answerStyle === "handwrite"){
      const ans = cand.options[cand.answerIndex];
      if(cand.type === "説明" || !hasKanji(ans) || ans.replace(/（.*?）|\(.*?\)/g, "").length > 6){
        if(attempt < 22) continue;
      }
    }

    if(inTest && session.usedQuestions.includes(cand.question)){
      continue;
    }

    q = cand;
    break;
  }

  if(!q) q = generateCandidate();

  if(inTest){
    session.usedQuestions.push(q.question);
    if(isExamPred){
      const currentPts = session.examWeights[session.testCount] || 7;
      q = {
        ...q,
        examFreq: true,
        freqRate: q.freqRate || "★★★★★",
        pts: currentPts
      };
    }
  }

  return q;
}

function scheduleMemoryReinforcement(q, isOk){
  if(!q) return;
  if(!session.spiralQueue) session.spiralQueue = [];
  session.spiralQueue = session.spiralQueue.filter(item => item.questionObj.question !== q.question);

  if(!isOk){
    const correctText = q.options[q.answerIndex];
    const shuffled = [...q.options].sort(() => Math.random() - 0.5);
    session.spiralQueue.push({
      wait: 2,
      reason: "記憶定着リトライ（2問前の復習）",
      questionObj: {
        ...q,
        options: shuffled,
        answerIndex: shuffled.indexOf(correctText)
      }
    });
    const similarQ = buildSimilarAngleQuestion(q);
    if(similarQ){
      session.spiralQueue.push({
        wait: 4,
        reason: "類題トレーニング（角度を変えて定着）",
        questionObj: similarQ
      });
    }
  } else if(!isTestMode() && !q.isSpiralReview && Math.random() < 0.45){
    const similarQ = buildSimilarAngleQuestion(q);
    if(similarQ){
      session.spiralQueue.push({
        wait: 3,
        reason: "関連知識の定着（さっきの単元の類題）",
        questionObj: similarQ
      });
    }
  }
  if(session.spiralQueue.length > 8) session.spiralQueue.length = 8;
}

function buildSimilarAngleQuestion(q){
  if(!q) return null;
  if(q.subject === "理科"){
    if(q.category === "オームの法則" || q.category === "電力と発熱"){
      return makeScience(q.category);
    }
    const sameCat = SCI_STATIC.filter(item => item.category === q.category && item.question !== q.question);
    if(sameCat.length > 0){
      const picked = sameCat[Math.floor(Math.random() * sameCat.length)];
      const opts = [picked.correct, ...picked.wrongs.sort(() => 0.5 - Math.random()).slice(0, 3)].sort(() => 0.5 - Math.random());
      return {
        subject: "理科",
        category: picked.category,
        type: picked.type,
        question: picked.question,
        options: opts,
        answerIndex: opts.indexOf(picked.correct),
        explanation: picked.explanation,
        deepDive: picked.deepDive || picked.explanation,
        tip: picked.tip,
        related: picked.related || []
      };
    }
  } else if(q.subject === "社会"){
    const ansText = q.options[q.answerIndex];
    const pMatch = HISTORY_DATA.people.find(p => p.name === ansText);
    if(pMatch && q.type === "人物"){
      const dummies = [...new Set(HISTORY_DATA.people.filter(x => x.name !== pMatch.name).map(x => x.desc))].sort(() => 0.5 - Math.random()).slice(0, 3);
      const opts = [pMatch.desc, ...dummies].sort(() => 0.5 - Math.random());
      return {
        subject: "社会",
        category: pMatch.category,
        type: "説明",
        question: `先ほど登場した「${pMatch.name}」の説明として正しいものはどれですか。`,
        options: opts,
        answerIndex: opts.indexOf(pMatch.desc),
        explanation: `「${pMatch.name}」は、${pMatch.desc}。`,
        deepDive: pMatch.deepDive || pMatch.desc,
        tip: pMatch.tip,
        related: []
      };
    }
    const tMatch = HISTORY_DATA.terms.find(t => t.name === ansText);
    if(tMatch && q.type === "用語"){
      const dummies = [...new Set(HISTORY_DATA.terms.filter(x => x.name !== tMatch.name).map(x => x.desc))].sort(() => 0.5 - Math.random()).slice(0, 3);
      const opts = [tMatch.desc, ...dummies].sort(() => 0.5 - Math.random());
      return {
        subject: "社会",
        category: tMatch.category,
        type: "説明",
        question: `先ほど登場した「${tMatch.name}」の説明として正しいものはどれですか。`,
        options: opts,
        answerIndex: opts.indexOf(tMatch.desc),
        explanation: `「${tMatch.name}」は、${tMatch.desc}。`,
        deepDive: tMatch.deepDive || tMatch.desc,
        tip: tMatch.tip,
        related: []
      };
    }
    return makeHistory(q.category);
  }
  return null;
}

function normalizeAnswerText(str){
  return String(str || "")
    .trim()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
    .replace(/（.*?）|\(.*?\)/g, "")
    .replace(/[\s・＝=]/g, "")
    .toLowerCase();
}

function checkWrittenMatch(inputText, correctText){
  const a = normalizeAnswerText(inputText);
  const b = normalizeAnswerText(correctText);
  if(!a) return false;
  if(a === b) return true;
  if(b.replace(/(?:ω|v|a|w|j|年)$/i, "") === a) return true;
  if(correctText.includes("摩擦電気") && (a === "静電気" || a === "摩擦電気")) return true;
  if(correctText.includes("領事裁判権") && (a === "領事裁判権" || a === "治外法権")) return true;
  return false;
}

function addOrUpdateWrongLog(q, isMiss = true){
  if(!q || !q.question) return;
  const idx = STATE.wrongLog.findIndex(item => item.question === q.question);
  if(idx !== -1){
    const existing = STATE.wrongLog[idx];
    existing.missCount = (existing.missCount || 0) + (isMiss ? 1 : 0);
    existing.streakOk = 0;
    STATE.wrongLog.splice(idx, 1);
    STATE.wrongLog.unshift(existing);
  } else {
    STATE.wrongLog.unshift({
      subject: q.subject,
      category: q.category,
      type: q.type,
      question: q.question,
      options: [...q.options],
      answerIndex: q.answerIndex,
      explanation: q.explanation,
      deepDive: q.deepDive || "",
      tip: q.tip || "",
      missCount: isMiss ? 1 : 0,
      streakOk: 0
    });
  }
  if(STATE.wrongLog.length > 60) STATE.wrongLog.length = 60;
}

function redrawScratchpad(){
  if(!padCanvas || !padCtx) return;
  const rect = padCanvas.getBoundingClientRect();
  const w = rect.width || 320;
  const h = rect.height || 190;
  padCtx.clearRect(0, 0, w, h);

  const chars = getExpectedAnswerChars();
  const cols = Math.min(6, Math.max(2, chars.length || 3));
  const cellW = w / cols;

  if(STATE.padGrid){
    padCtx.save();
    padCtx.strokeStyle = "rgba(148, 163, 184, 0.45)";
    padCtx.lineWidth = 1;
    for(let i = 1; i < cols; i++){
      padCtx.beginPath();
      padCtx.moveTo(cellW * i, 6);
      padCtx.lineTo(cellW * i, h - 6);
      padCtx.stroke();
    }
    padCtx.setLineDash([4, 4]);
    for(let i = 0; i < cols; i++){
      const cx = cellW * i + cellW / 2;
      const cy = h / 2;
      padCtx.beginPath();
      padCtx.moveTo(cx, 10);
      padCtx.lineTo(cx, h - 10);
      padCtx.moveTo(cellW * i + 8, cy);
      padCtx.lineTo(cellW * (i + 1) - 8, cy);
      padCtx.stroke();
    }
    padCtx.restore();
  }

  if(!isTestMode() && STATE.padTraceGuide && chars.length > 0){
    padCtx.save();
    padCtx.fillStyle = "rgba(148, 163, 184, 0.24)";
    padCtx.font = `bold ${Math.min(Math.floor(cellW * 0.68), 88)}px "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif`;
    padCtx.textAlign = "center";
    padCtx.textBaseline = "middle";
    for(let i = 0; i < Math.min(chars.length, cols); i++){
      padCtx.fillText(chars[i], cellW * i + cellW / 2, h / 2 + 4);
    }
    padCtx.restore();
  }

  for(const stroke of session.padHistory){
    if(!stroke.points || stroke.points.length === 0) continue;
    padCtx.save();
    padCtx.lineCap = "round";
    padCtx.lineJoin = "round";
    padCtx.lineWidth = stroke.size || 4;
    if(stroke.tool === "eraser"){
      padCtx.globalCompositeOperation = "destination-out";
      padCtx.strokeStyle = "rgba(0,0,0,1)";
    } else {
      padCtx.strokeStyle = stroke.color === "auto"
        ? (document.documentElement.getAttribute("data-theme") === "dark" ? "#f1f5f9" : "#1b2028")
        : stroke.color;
    }
    padCtx.beginPath();
    padCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
    for(let i = 1; i < stroke.points.length; i++){
      padCtx.lineTo(stroke.points[i].x, stroke.points[i].y);
    }
    if(stroke.points.length === 1){
      padCtx.lineTo(stroke.points[0].x + 0.1, stroke.points[0].y + 0.1);
    }
    padCtx.stroke();
    padCtx.restore();
  }
}

function getAllCandidateVocabulary(){
  const set = new Set();
  for(const s of SCI_STATIC) set.add(s.correct.replace(/（.*?）|\(.*?\)/g, "").trim());
  for(const p of HISTORY_DATA.people) set.add(p.name.trim());
  for(const t of HISTORY_DATA.terms) set.add(t.name.trim());
  for(const e of HISTORY_DATA.events){ set.add(e.name.trim()); set.add(e.year.trim()); }
  if(session.q){
    for(const o of session.q.options) set.add(o.replace(/（.*?）|\(.*?\)/g, "").trim());
  }
  return Array.from(set).filter(Boolean);
}

function rasterizeGlyphData(ch){
  const size = 32;
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#000";
  ctx.font = 'bold 26px "Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif';
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(ch, size / 2, size / 2 + 1);
  const img = ctx.getImageData(0, 0, size, size).data;

  let minX = size, minY = size, maxX = 0, maxY = 0, hasInk = false;
  for(let y = 0; y < size; y++){
    for(let x = 0; x < size; x++){
      if(img[(y * size + x) * 4 + 3] > 40){
        hasInk = true;
        if(x < minX) minX = x;
        if(y < minY) minY = y;
        if(x > maxX) maxX = x;
        if(y > maxY) maxY = y;
      }
    }
  }
  const aspect = hasInk ? (maxX - minX + 1) / Math.max(1, (maxY - minY + 1)) : 1;

  const weights = [0.25, 0.6, 1.0, 0.6, 0.25];
  const grid = new Float32Array(size * size);
  for(let y = 0; y < size; y++){
    for(let x = 0; x < size; x++){
      let sum = 0, wSum = 0;
      for(let dy = -2; dy <= 2; dy++){
        for(let dx = -2; dx <= 2; dx++){
          const nx = x + dx, ny = y + dy;
          if(nx >= 0 && nx < size && ny >= 0 && ny < size){
            const w = weights[dy + 2] * weights[dx + 2];
            sum += (img[(ny * size + nx) * 4 + 3] / 255) * w;
            wSum += w;
          }
        }
      }
      grid[y * size + x] = sum / wSum;
    }
  }
  return { grid, aspect };
}

const GLYPH_CACHE = {};
function getGlyphData(ch){
  if(!GLYPH_CACHE[ch]) GLYPH_CACHE[ch] = rasterizeGlyphData(ch);
  return GLYPH_CACHE[ch];
}

function groupStrokesIntoCharacters(strokes, canvasWidth, cols){
  const cellW = canvasWidth / cols;
  const strokeStats = strokes.map(st => {
    let minX = Infinity, maxX = -Infinity, sumX = 0;
    for(const p of st.points){
      if(p.x < minX) minX = p.x;
      if(p.x > maxX) maxX = p.x;
      sumX += p.x;
    }
    const centerX = sumX / st.points.length;
    const cellIdx = Math.min(cols - 1, Math.max(0, Math.floor(centerX / cellW)));
    return { st, minX, maxX, centerX, cellIdx };
  });

  if(STATE.padGrid){
    const buckets = Array.from({ length: cols }, () => []);
    for(const item of strokeStats){
      buckets[item.cellIdx].push(item.st);
    }
    return buckets.filter(b => b.length > 0);
  }

  const sorted = [...strokeStats].sort((a, b) => a.minX - b.minX);
  const groups = [];
  let curGroup = [sorted[0]];
  let curMaxX = sorted[0].maxX;
  const gapThreshold = Math.max(24, cellW * 0.22);

  for(let i = 1; i < sorted.length; i++){
    const item = sorted[i];
    if(item.minX > curMaxX + gapThreshold * 0.35 && item.centerX - curMaxX > gapThreshold * 0.2){
      groups.push(curGroup.map(x => x.st));
      curGroup = [item];
      curMaxX = item.maxX;
    } else {
      curGroup.push(item);
      if(item.maxX > curMaxX) curMaxX = item.maxX;
    }
  }
  if(curGroup.length > 0) groups.push(curGroup.map(x => x.st));
  return groups;
}

function recognizeHandwritingCandidates(){
  const strokes = session.padHistory.filter(s => s.tool !== "eraser" && s.points && s.points.length > 0);
  if(strokes.length === 0) return [];
  const w = (padCanvas && padCanvas.getBoundingClientRect().width) || 320;
  const expectedChars = getExpectedAnswerChars();
  const cols = Math.min(6, Math.max(2, expectedChars.length || 3));
  const charGroups = groupStrokesIntoCharacters(strokes, w, cols);
  if(charGroups.length === 0) return [];

  const size = 32;
  const weights = [0.25, 0.6, 1.0, 0.6, 0.25];

  const cellSamples = charGroups.map(sts => {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for(const st of sts){
      for(const p of st.points){
        if(p.x < minX) minX = p.x;
        if(p.y < minY) minY = p.y;
        if(p.x > maxX) maxX = p.x;
        if(p.y > maxY) maxY = p.y;
      }
    }
    const rawW = Math.max(1, maxX - minX);
    const rawH = Math.max(1, maxY - minY);
    const aspect = rawW / rawH;
    const bw = Math.max(22, rawW);
    const bh = Math.max(22, rawH);
    const scale = 24 / Math.max(bw, bh);
    const ox = (size - rawW * scale) / 2;
    const oy = (size - rawH * scale) / 2;

    const c = document.createElement("canvas");
    c.width = size; c.height = size;
    const ctx = c.getContext("2d");
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2.8;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for(const st of sts){
      ctx.beginPath();
      ctx.moveTo((st.points[0].x - minX) * scale + ox, (st.points[0].y - minY) * scale + oy);
      for(let i = 1; i < st.points.length; i++){
        ctx.lineTo((st.points[i].x - minX) * scale + ox, (st.points[i].y - minY) * scale + oy);
      }
      if(st.points.length === 1){
        ctx.lineTo((st.points[0].x - minX) * scale + ox + 0.2, (st.points[0].y - minY) * scale + oy + 0.2);
      }
      ctx.stroke();
    }
    const img = ctx.getImageData(0, 0, size, size).data;
    const grid = new Float32Array(size * size);
    for(let y = 0; y < size; y++){
      for(let x = 0; x < size; x++){
        let sum = 0, wSum = 0;
        for(let dy = -2; dy <= 2; dy++){
          for(let dx = -2; dx <= 2; dx++){
            const nx = x + dx, ny = y + dy;
            if(nx >= 0 && nx < size && ny >= 0 && ny < size){
              const wt = weights[dy + 2] * weights[dx + 2];
              sum += (img[(ny * size + nx) * 4 + 3] / 255) * wt;
              wSum += wt;
            }
          }
        }
        grid[y * size + x] = sum / wSum;
      }
    }
    return { grid, aspect };
  });

  function calcMaxShiftSimilarity(g1, g2){
    let best = 0;
    const shifts = [[0,0], [-2,0], [2,0], [0,-2], [0,2]];
    for(const [sx, sy] of shifts){
      let dot = 0, n1 = 0, n2 = 0;
      for(let y = 2; y < size - 2; y++){
        const row1 = y * size;
        const row2 = (y + sy) * size;
        for(let x = 2; x < size - 2; x++){
          const v1 = g1[row1 + x];
          const v2 = g2[row2 + x + sx];
          dot += v1 * v2;
          n1 += v1 * v1;
          n2 += v2 * v2;
        }
      }
      const cos = (n1 > 0 && n2 > 0) ? dot / (Math.sqrt(n1) * Math.sqrt(n2)) : 0;
      if(cos > best) best = cos;
    }
    return best;
  }

  const vocab = getAllCandidateVocabulary();
  const scored = vocab.map(word => {
    const chars = Array.from(word);
    const lenDiff = Math.abs(chars.length - cellSamples.length);
    let sim = 0;
    const compareLen = Math.min(chars.length, cellSamples.length);
    for(let i = 0; i < compareLen; i++){
      const sample = cellSamples[i];
      const glyph = getGlyphData(chars[i]);
      const shapeSim = calcMaxShiftSimilarity(sample.grid, glyph.grid);
      const aspectDiff = Math.abs(Math.log(Math.max(0.25, sample.aspect) / Math.max(0.25, glyph.aspect)));
      const aspectBonus = Math.max(0, 1 - aspectDiff * 0.45);
      sim += shapeSim * 0.85 + aspectBonus * 0.15;
    }
    const avgSim = compareLen > 0 ? sim / compareLen : 0;
    const lenBonus = lenDiff === 0 ? 0.14 : -lenDiff * 0.22;
    return { word, score: avgSim + lenBonus };
  });

  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 5).map(s => s.word);
}

function updateHandwritingCandidates(){
  const box = document.getElementById("hw-candidates");
  if(!box) return;
  const cands = recognizeHandwritingCandidates();
  if(cands.length === 0){
    const expectedLen = getExpectedAnswerChars().length;
    box.innerHTML = `<span style="font-size:11.5px;color:var(--sub)">上のマス目（全${expectedLen}文字）に左から1文字ずつ大きく書くと候補が出ます</span>`;
    return;
  }
  box.innerHTML = `<span style="font-size:11.5px;font-weight:800;color:var(--sub)">認識候補（タップで回答）：</span>` +
    cands.map((w, idx) => `<button class="chip-btn ${idx === 0 ? "active" : ""}" style="padding:5px 12px;font-size:12.5px" onclick="submitHandwritingCandidate('${escapeHtml(w)}')">${escapeHtml(w)}</button>`).join("");
}

}

function submitHandwritingPad(){
  if(session.answered) return;

    return;
  }
  handleQuizAnswer(-1, false, cands[0], true);
}

function handleQuizAnswer(idx, isTimeout = false, writtenText = null, fromHandwriting = false){
  if(session.answered || !session.q) return;
  session.answered = true;
  session.recallChecked = false;
  stopQuestionTimer();
  syncDailyProgress();
  const elapsedMs = session.qStartAt ? Math.max(0, Date.now() - session.qStartAt) : 0;
  const q = session.q;
  const correctText = q.options[q.answerIndex];
  const isWrite = writtenText !== null;
  const isOk = !isTimeout && (isWrite ? checkWrittenMatch(writtenText, correctText) : idx === q.answerIndex);

  scheduleMemoryReinforcement(q, isOk);

  STATE.totalAnswered++;
  STATE.todayCount = (STATE.todayCount || 0) + 1;
  STATE.lastStudyDate = STATE.todayDate;

  if(!STATE.unitStats[q.category]) STATE.unitStats[q.category] = { total: 0, correct: 0 };
  STATE.unitStats[q.category].total++;

  let gainedXp = 0;
  if(isOk){
    SFX.ok();
    STATE.totalCorrect++;
    STATE.streak++;
    if(STATE.streak > STATE.maxStreak) STATE.maxStreak = STATE.streak;
    STATE.unitStats[q.category].correct++;
    gainedXp = fromHandwriting ? 25 : isWrite ? 20 : (STATE.quizMode === "exam_pred" ? 15 : 10);
    if(STATE.streak > 0 && STATE.streak % 5 === 0) triggerCelebration();
  } else {
    SFX.ng();
    STATE.streak = 0;
    gainedXp = 3;
    addOrUpdateWrongLog(q, true);
    session.isPinnedNow = true;
    if(isTestMode()){
      session.testMisses.push({
        question: q.question,
        category: q.category,
        subject: q.subject,
        pts: q.pts || 7,
        correct: correctText,
        chosen: isTimeout ? "時間切れ" : isWrite ? writtenText : q.options[idx],
        explanation: q.explanation,
        deepDive: q.deepDive || "",
        tip: q.tip || ""
      });
    }
  }
  STATE.xp = (STATE.xp || 0) + gainedXp;

  if(isTestMode()){
    session.testCount++;
    session.testTotalMs += elapsedMs;
    if(!session.testUnitScores[q.category]){
      session.testUnitScores[q.category] = { subject: q.subject, total: 0, correct: 0 };
    }
    session.testUnitScores[q.category].total++;
    if(isOk){
      session.testCorrect++;
      session.testUnitScores[q.category].correct++;
      if(STATE.quizMode === "exam_pred"){
        session.examPointsEarned += (q.pts || 7);
      }
    }
  }
  saveState();

  const btns = document.querySelectorAll("#quiz-opts .opt");
  btns.forEach((b, i) => {
    b.disabled = true;
    if(i === q.answerIndex) b.classList.add("ok");
    else if(i === idx && !isOk) b.classList.add("ng");
  });
  const wInp = document.getElementById("written-ans-input");
  if(wInp) wInp.disabled = true;
  const wBtn = document.getElementById("written-submit-btn");
  if(wBtn) wBtn.disabled = true;

  const fbArea = document.getElementById("quiz-fb");
  const totalQ = getTestTotalQuestions();
  const isTestEnd = isTestMode() && session.testCount >= totalQ;
  const nextLabel = isTestEnd
    ? (STATE.quizMode === "exam_pred" ? "定期試験予想模試の成績表を見る" : "実践テスト結果を見る")
    : "次の問題へ";
  const resultHeading = isTimeout ? "時間切れ…！" : isOk ? `正解！（+${gainedXp} EXP）` : `不正解…（+${gainedXp} EXP）`;

  const modeNotice = isTestMode()
    ? "※実践テスト本番モード中のため、復習問題の割り込みは停止しています（終了後に復習できます）。"
    : (!isOk
        ? "※記憶定着のため、2問後に同じ問題・4問後に類題が自動で再出題されます。"
        : (session.spiralQueue && session.spiralQueue.length > 0 ? `※現在 ${session.spiralQueue.length} 問の定着リトライ／類題が待機中です。` : ""));

  const noteKey = getStudyNoteKey(q);
  const existingNote = (STATE.studyNotes && STATE.studyNotes[noteKey]) || { level: "", memo: "" };
  const relatedLinks = (q.related && q.related.length > 0) ? q.related : [
    { label: `${q.category}の用語・公式を確認`, tab: "guide", search: "" }
  ];

  fbArea.innerHTML = `
    <div class="fb ${isOk ? "ok" : "ng"}">
      <div class="fb-head">
        <div class="res-title">${resultHeading}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">
          <button id="recall-btn" class="pin-btn" onclick="toggleRecallCheck()">🧠 答えを見ずに3秒思い出す（+5 EXP）</button>
          <button id="pin-btn" class="pin-btn ${session.isPinnedNow ? "pinned" : ""}" onclick="togglePinQuestion()">
            ${session.isPinnedNow ? "★ 要復習に登録済" : "☆ 要復習にピン留め"}
          </button>
        </div>
      </div>
      ${fromHandwriting ? `<div style="font-size:12.5px;font-weight:800;margin-bottom:3px">手書き認識：「${escapeHtml(writtenText)}」</div>` : ""}
      ${isWrite ? `<div style="font-weight:900;font-size:15px;margin-bottom:6px;color:var(--ok)">模範解答：${escapeHtml(correctText)}</div>` : ""}
      <div style="white-space:pre-line">${escapeHtml(q.explanation)}</div>

      ${q.deepDive ? `
        <div class="deep-box">
          <div class="deep-head">
            <span>🔍 なぜ？を深く理解する（仕組み・歴史のつながり）</span>
          </div>
          <div style="white-space:pre-line">${escapeHtml(q.deepDive)}</div>
        </div>
      ` : ""}

      ${q.mnemonics && q.mnemonics.length > 0 ? `
        <div class="mnemonic-box">
          <div class="mnemonic-head">
            <span>🎵 覚えやすい年号・語呂合わせ（複数パターン）</span>
            <span style="font-size:10.5px;font-weight:700">気に入ったものをマイメモに保存できます</span>
          </div>
          <div class="mnemonic-list">
            ${q.mnemonics.map((m, mIdx) => `
              <div class="mnemonic-item">
                <span>「${escapeHtml(m)}」</span>
                <button class="mnemonic-save-btn" onclick="applyMnemonicToMemo(${mIdx})">＋マイメモへ</button>
              </div>
            `).join("")}
          </div>
        </div>
      ` : ""}

      ${q.tip ? `
        <div class="tip-box">
          <div class="tip-label">重要公式・暗記ポイント</div>
          <div>${escapeHtml(q.tip)}</div>
        </div>
      ` : ""}

      <div class="feynman-box">
        <div class="feynman-title">
          <span>✍️ 理解度セルフチェック ＆ マイ学習メモ</span>
          <span id="mymemo-status" style="font-size:11px;color:var(--acc)">${existingNote.memo ? "保存済" : ""}</span>
        </div>
        <div class="mastery-pills">
          <button class="m-pill ${existingNote.level === "high" ? "active-high" : ""}" data-lvl="high" onclick="setFeynmanLevel('high')">◎ 理由まで説明できる</button>
          <button class="m-pill ${existingNote.level === "mid" ? "active-mid" : ""}" data-lvl="mid" onclick="setFeynmanLevel('mid')">△ 答えはわかった</button>

        </div>
        <div class="mymemo-row">
          <input id="mymemo-inp" class="mymemo-input" type="text" placeholder="自分なりの覚え方・語呂合わせ・注意点をメモ…" value="${escapeHtml(existingNote.memo || "")}" onkeydown="if(event.key==='Enter'){event.stopPropagation();saveMyStudyMemo();}">

  if(STATE.autoNext && !isTestEnd){

}

function renderTestResult(){
  const isExamPred = STATE.quizMode === "exam_pred";
  const totalQ = getTestTotalQuestions();
  const score100 = isExamPred ? session.examPointsEarned : Math.round((session.testCorrect / totalQ) * 100);

  if(isExamPred && (STATE.bestExamScore === null || score100 > STATE.bestExamScore)){
    STATE.bestExamScore = score100;
    saveState();
  }

  if(score100 >= 80) triggerCelebration();

  const totalSec = (session.testTotalMs / 1000).toFixed(1);
  const avgSec = (session.testTotalMs / (totalQ * 1000)).toFixed(1);

  let rankLetter = "C";
  let rankLabel = "基礎固めが必要（要復習）";
  let adviceText = "まずは解説・公式集で基本公式と重要語句を確認し、間違えた問題を「苦手復習」タブで解き直しましょう！";
  if(score100 >= 90){
    rankLetter = "S";
    rankLabel = "定期試験 90点オーバー圏内！（学年上位レベル）";
    adviceText = "素晴らしい実力です！引っ掛け問題や計算問題も確実に得点できています。記述・漢字ミスに気をつければ高得点は間違いなしです。";
  } else if(score100 >= 75){
    rankLetter = "A";
    rankLabel = "合格圏内・あと一歩で高得点！";
    adviceText = "基礎から応用までよく理解できています。今回落とした比較問題・単位変換などのミスを潰せば、本番で90点以上が狙えます。";
  } else if(score100 >= 55){
    rankLetter = "B";
    rankLabel = "標準レベル・頻出単元の強化で伸びる！";
    adviceText = "基本問題は解けていますが、定期試験で差がつく応用・比較問題で失点しています。下の単元別結果で正答率が低い単元を重点復習しましょう。";

  const unitEntries = Object.entries(session.testUnitScores || {});
  const unitBreakdownHtml = unitEntries.length > 0 ? `

      ${unitEntries.map(([cat, st]) => {
        const uPct = Math.round((st.correct / st.total) * 100);
        const col = uPct >= 80 ? "var(--sci)" : uPct >= 50 ? "var(--tipbd)" : "var(--ng)";
        return `
          <div style="margin-bottom:7px">
            <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:3px">
              <span><span class="tag ${st.subject === "理科" ? "sub-sci" : "sub-soc"}" style="padding:1px 6px;font-size:10px">${st.subject}</span> ${escapeHtml(cat)}</span>

========================================================= */
function pickReviewQuestion(){
  if(!STATE.wrongLog || STATE.wrongLog.length === 0) return null;
  let candidates = STATE.wrongLog;
  if(session.revQ && STATE.wrongLog.length > 1){
    const filtered = STATE.wrongLog.filter(x => x.question !== session.revQ.question);
    if(filtered.length > 0) candidates = filtered;
  }
  const picked = candidates[Math.floor(Math.random() * candidates.length)];
  const correctText = picked.options[picked.answerIndex];
  const shuffledOpts = [...picked.options].sort(() => Math.random() - 0.5);
  return {
    ...picked,
    options: shuffledOpts,
    answerIndex: shuffledOpts.indexOf(correctText)
  };
}

function setReviewSubMode(mode){
  SFX.tap();
  STATE.reviewSubMode = mode;
  saveState();
  render();
}

function setMasteryTarget(target){
  SFX.tap();

function removeWrongItem(idx){
  SFX.tap();

  session.revCardOpen = {};
  saveState();
  render();

function nextReviewQuestion(){
  SFX.tap();
  session.revQ = pickReviewQuestion();
  session.revAnswered = false;
  render();
}

function handleReviewAnswer(idx){
  if(session.revAnswered || !session.revQ) return;
  session.revAnswered = true;
  const q = session.revQ;
  const isOk = idx === q.answerIndex;
  const logIdx = STATE.wrongLog.findIndex(x => x.question === q.question);
  let mastered = false;
  let currentStreak = 0;

  if(isOk){
    SFX.ok();
    STATE.xp = (STATE.xp || 0) + 15;
    if(logIdx !== -1){
      STATE.wrongLog[logIdx].streakOk = (STATE.wrongLog[logIdx].streakOk || 0) + 1;
      currentStreak = STATE.wrongLog[logIdx].streakOk;
      if(currentStreak >= STATE.reviewMasteryTarget){
        STATE.wrongLog.splice(logIdx, 1);
        mastered = true;
        triggerCelebration();
      }
    }
  } else {
    SFX.ng();
    if(logIdx !== -1){
      STATE.wrongLog[logIdx].streakOk = 0;
      STATE.wrongLog[logIdx].missCount = (STATE.wrongLog[logIdx].missCount || 0) + 1;
    }
  }
  saveState();

  const btns = document.querySelectorAll("#rev-opts .opt");
  btns.forEach((b, i) => {
    b.disabled = true;
    if(i === q.answerIndex) b.classList.add("ok");
    else if(i === idx && !isOk) b.classList.add("ng");
  });

  const fbArea = document.getElementById("rev-fb");
  if(fbArea){
    const titleText = isOk
      ? (mastered ? "正解！苦手克服おめでとう！（+15 EXP）" : `正解！あと ${STATE.reviewMasteryTarget - currentStreak} 回で克服（+15 EXP）`)
      : "不正解…連続正解数がリセットされました";
    const nextBtnHtml = STATE.wrongLog.length > 0
      ? `<button class="btn" onclick="nextReviewQuestion()">次の苦手問題へ</button>`
      : `<button class="btn" onclick="render()">完了（すべて克服！）</button>`;

    fbArea.innerHTML = `
      <div class="fb ${isOk ? "ok" : "ng"}">
        <div class="fb-head">
          <div class="res-title">${titleText}</div>
        </div>
        <div style="white-space:pre-line">${escapeHtml(q.explanation)}</div>
        ${q.deepDive ? `
          <div class="deep-box">
            <div class="deep-head"><span>🔍 なぜ？を深く理解する</span></div>
            <div style="white-space:pre-line">${escapeHtml(q.deepDive)}</div>
          </div>
        ` : ""}
        ${q.tip ? `
          <div class="tip-box">
            <div class="tip-label">重要公式・暗記ポイント</div>
            <div>${escapeHtml(q.tip)}</div>
          </div>
        ` : ""}
        ${nextBtnHtml}
      </div>
    `;
  }
}

        </div>
        <div class="mode-switch">
          <button class="${STATE.reviewMasteryTarget === 1 ? "active" : ""}" onclick="setMasteryTarget(1)">1回正解で解除</button>
          <button class="${STATE.reviewMasteryTarget === 2 ? "active" : ""}" onclick="setMasteryTarget(2)">2回連続で解除</button>
        </div>
      </div>
      ${bodyHtml}
    </div>
  `;
}

      </div>
      ${unitChipsHtml}
      <input id="guide-search-inp" class="search-input" type="text" placeholder="用語・人物・年号・公式を検索（例：オーム、徳川吉宗、1853）" value="${escapeHtml(STATE.guideSearch || "")}" oninput="setGuideSearch(this.value)">
      ${renderComparisonDiagrams()}
      ${myMemoSectionHtml}
      ${formulasHtml}
      <div style="font-weight:900;font-size:13.5px;margin-bottom:8px;color:var(--sub)">用語・年号・深掘り解説データベース（${filtered.length}件）</div>
      ${filtered.slice(0, 85).map(item => `
        <div class="review-item">
          <div style="margin-bottom:4px">
            <span class="tag ${item.subject === "理科" ? "sub-sci" : "sub-soc"}">${item.subject}</span>
            <span class="tag">${item.category}</span>
          </div>
          <div class="review-q">
            <span class="${STATE.redSheet ? "red-mask guide-red-mask" : ""}" onclick="if(this.classList.contains('red-mask'))this.classList.toggle('revealed')">${escapeHtml(item.term)}</span>
          </div>
          <div class="review-exp">${escapeHtml(item.explanation)}</div>
          ${item.mnemonics && item.mnemonics.length > 0 ? `
            <div style="margin-top:6px;padding:6px 9px;border-radius:8px;background:var(--socbg);border:1px solid var(--soc);font-size:12px">
              <div style="font-weight:900;color:var(--soc);margin-bottom:2px">🎵 おすすめ語呂合わせ：</div>
              ${item.mnemonics.map(m => `<div style="font-weight:800">・「${escapeHtml(m)}」</div>`).join("")}
            </div>
          ` : ""}
          ${item.deepDive ? `<div style="font-size:12px;color:var(--deep);font-weight:700;margin-top:4px">${escapeHtml(item.deepDive)}</div>` : ""}
          ${item.tip ? `<div style="font-size:11.5px;font-weight:800;color:var(--tip);margin-top:4px">★ ${escapeHtml(item.tip)}</div>` : ""}
        </div>
      `).join("")}
    </div>
  `;
}

/* =========================================================
   12. タブ4：成績分析＆弱点診断ビュー
========================================================= */
function askReset(action){
  SFX.tap();
  session.confirmAction = action;
  render();
}
function cancelReset(){
  SFX.tap();
  session.confirmAction = null;
  render();
}
function execReset(){
  SFX.tap();
  if(session.confirmAction === "wrong"){
    STATE.wrongLog = [];
  } else if(session.confirmAction === "all"){
    STATE.totalAnswered = 0;
    STATE.totalCorrect = 0;
    STATE.streak = 0;
    STATE.maxStreak = 0;
    STATE.xp = 0;
    STATE.todayCount = 0;
    STATE.unitStats = {};
    STATE.wrongLog = [];
    STATE.bestExamScore = null;
    STATE.studyNotes = {};
  }
  session.confirmAction = null;
  saveState();
  render();
}

function renderStatsTab(){
  const pct = STATE.totalAnswered ? Math.round((STATE.totalCorrect / STATE.totalAnswered) * 100) : 0;
  const weakUnits = getWeakUnitsSummary();
  const weakTypes = getWeakTypeSummary();

  const weakDiagnosisHtml = weakUnits.length > 0 ? `
    <div style="background:var(--ngbg);border:1.5px solid var(--ng);border-radius:14px;padding:12px;margin-bottom:14px">
      <div style="font-weight:900;font-size:13.5px;color:var(--ng);margin-bottom:5px">重点弱点診断（正答率75%未満の単元）</div>
      <div style="font-size:12.5px;margin-bottom:8px">
        最も強化すべき単元：<strong>${escapeHtml(weakUnits[0].category)}（正答率 ${weakUnits[0].rate}%）</strong>
        ${weakTypes.length > 0 ? `<br>つまずきやすい出題形式：<strong>「${escapeHtml(weakTypes[0][0])}」問題（ミス ${weakTypes[0][1]}回）</strong>` : ""}
      </div>
      <button class="btn danger" style="margin-top:0;padding:10px" onclick="startWeaknessDrill()">弱点単元だけ集中トレーニングを開始</button>
    </div>
  ` : `
    <div style="background:var(--scibg);border:1.5px solid var(--sci);border-radius:14px;padding:12px;margin-bottom:14px;font-size:12.5px">
      <strong style="color:var(--sci)">弱点診断：全単元バランスよく習得できています！</strong><br>
      さらに実力を伸ばすには「定期試験・予想模試」で100点満点にチャレンジしてみましょう。
    </div>
  `;

  const unitRowsHtml = ALL_UNITS_META.map(u => {
    const st = STATE.unitStats[u.category] || { total: 0, correct: 0 };
    const uPct = st.total ? Math.round((st.correct / st.total) * 100) : 0;
    const barColor = !st.total ? "var(--sub)" : uPct >= 80 ? "var(--sci)" : uPct >= 60 ? "var(--tipbd)" : "var(--ng)";
    return `
      <div class="unit-row">
        <div class="unit-top">
          <div>
            <span class="tag ${u.subject === "理科" ? "sub-sci" : "sub-soc"}">${u.subject}</span>
            <span style="margin-left:4px">${u.category}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="num" style="color:${barColor}">${st.total ? `${st.correct}/${st.total}問 (${uPct}%)` : "未挑戦"}</span>
            <button class="pill-btn" style="padding:3px 9px;font-size:11px" onclick="jumpToUnitQuiz('${u.subject}','${u.category}')">演習</button>
          </div>
        </div>
        <div class="unit-bar"><div class="unit-fill" style="width:${uPct}%;background:${barColor}"></div></div>
      </div>
    `;
  }).join("");

  const confirmHtml = session.confirmAction ? `
    <div class="confirm-box">
      <div style="margin-bottom:8px">${session.confirmAction === "wrong" ? "苦手問題リストをすべて空にしますか？" : "これまでの学習成績・最高記録・苦手リストをすべて初期化しますか？"}</div>
      <div style="display:flex;gap:8px">
        <button class="btn danger" style="margin-top:0;padding:9px" onclick="execReset()">はい、実行する</button>
        <button class="btn ghost" style="margin-top:0;padding:9px" onclick="cancelReset()">キャンセル</button>
      </div>
    </div>
  ` : "";

  return `
    <div class="card">
      <div class="stat-grid">
        <div class="stat-tile">
          <div class="stat-tile-lbl">総回答数</div>
          <div class="stat-tile-val num">${STATE.totalAnswered}<span style="font-size:12px">問</span></div>
        </div>
        <div class="stat-tile">
          <div class="stat-tile-lbl">通算正答率</div>
          <div class="stat-tile-val num" style="color:var(--acc)">${pct}<span style="font-size:13px">%</span></div>
        </div>
        <div class="stat-tile">
          <div class="stat-tile-lbl">予想模試ベスト</div>
          <div class="stat-tile-val num" style="color:var(--exam)">${STATE.bestExamScore !== null ? `${STATE.bestExamScore}<span style="font-size:12px">点</span>` : "未受験"}</div>
        </div>
      </div>

      ${weakDiagnosisHtml}

      <div style="font-weight:900;font-size:14px;margin-bottom:4px">単元別の習熟度・正答率</div>
      ${unitRowsHtml}

      <div style="margin-top:14px">
        <button class="btn ghost" onclick="askReset('wrong')">苦手リストをクリア</button>
        <button class="btn ghost" style="color:var(--ng);border-color:var(--ng)" onclick="askReset('all')">全学習データをリセット</button>
        ${confirmHtml}
      </div>
    </div>
  `;
}

/* =========================================================
   13. 全体レンダリング＆キーボードショートカット
========================================================= */
function render(){
  let content = "";
  if(STATE.activeTab === "quiz") content = renderQuizTab();
  else if(STATE.activeTab === "review") content = renderReviewTab();
  else if(STATE.activeTab === "guide") content = renderGuideTab();
  else content = renderStatsTab();

  app.innerHTML = renderShell() + content;
  if(STATE.activeTab === "quiz" && STATE.answerStyle === "handwrite"){
    initScratchpadCanvas();
  }
  if(STATE.activeTab === "quiz" && STATE.answerStyle !== "handwrite" && STATE.showCalcMemo){
    initCalcMemoCanvas();
  }
}

document.addEventListener("keydown", e => {
  if(session.activeModal){
    if(e.key === "Escape") closeModal();
    return;
  }
  if(document.activeElement && (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA")) return;
  if(STATE.activeTab === "quiz"){
    if(!session.answered && STATE.answerStyle === "choice" && ["1", "2", "3", "4"].includes(e.key)){
      handleQuizAnswer(Number(e.key) - 1);
    } else if(session.answered && e.key === "Enter"){
      nextQuizQuestion();
    }
  } else if(STATE.activeTab === "review" && STATE.reviewSubMode === "retest"){
    if(!session.revAnswered && ["1", "2", "3", "4"].includes(e.key)){
      handleReviewAnswer(Number(e.key) - 1);
    } else if(session.revAnswered && e.key === "Enter" && STATE.wrongLog.length > 0){
      nextReviewQuestion();
    }
  }
});

window.addEventListener("resize", () => {
  if(STATE.activeTab === "quiz" && STATE.answerStyle === "handwrite"){
    initScratchpadCanvas();
  }
  if(STATE.activeTab === "quiz" && STATE.answerStyle !== "handwrite" && STATE.showCalcMemo){
    initCalcMemoCanvas();
  }
});

window.addEventListener("online", () => {
  session.isOnline = true;
  const el = document.getElementById("net-status");
  if(el){ el.className = "offline-badge online"; el.textContent = "オフライン動作対応"; }
});
window.addEventListener("offline", () => {
  session.isOnline = false;
  const el = document.getElementById("net-status");
  if(el){ el.className = "offline-badge offline"; el.textContent = "オフライン稼働中"; }
});

render();
startQuestionTimer();
</script>
</body>
</html>
